# ---------------------------------------------------------------
# UAT environment configuration (used with: mvn test -Denv=uat)
# ---------------------------------------------------------------

# Base URL of the application under test (as given in the capstone guide)
baseUrl=https://gorest.co.in/
# NOTE: GoRest has only one public host, so UAT points to the same URL as QA.
# In a real project this would be the UAT server URL.

# Version path of the GoRest public API; appended to baseUrl for every request
basePath=/public/v2

# Maximum accepted response time (milliseconds) for the response-time validation
maxResponseTimeMs=5000

# GoRest personal access token (needed for POST / PUT / DELETE).
# DO NOT commit a real token. Pass it at run time instead:
#     mvn test -Denv=qa -Dtoken=<your_token>
# or set the environment variable GOREST_TOKEN.
token=
